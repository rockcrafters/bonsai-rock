name: Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build-per-arch:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build base rock (no model)
        uses: canonical/craft-actions/rockcraft/pack@main
        with:
          path: bonsai/${{ inputs.version }}
          verbosity: brief

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Inject model shards
        working-directory: bonsai/${{ inputs.version }}
        run: |
          base=$(ls bonsai_${{ inputs.version }}_*.rock)
          SKOPEO=skopeo ruby hack/inject.rb "$base" injected.rock
          rm -f "$base"
          mv injected.rock bonsai_${{ inputs.version }}_${{ matrix.arch }}.rock

      - name: Save rock as artifact
        uses: actions/upload-artifact@v6
        with:
          name: bonsai_${{ inputs.version }}_${{ matrix.arch }}
          path: bonsai/${{ inputs.version }}/bonsai_${{ inputs.version }}_${{ matrix.arch }}.rock

  build-multiarch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build-per-arch
    steps:
      - name: Download rock artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bonsai_${{ inputs.version }}_*
          path: artifacts
          merge-multiple: true

      - name: Create multiarch rock
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah
          ls -lha artifacts
          buildah manifest create multiarch-rock
          buildah manifest add \
            --arch amd64 \
            multiarch-rock oci-archive:artifacts/bonsai_${{ inputs.version }}_amd64.rock
          buildah manifest add \
            --arch arm64 \
            multiarch-rock oci-archive:artifacts/bonsai_${{ inputs.version }}_arm64.rock
          buildah manifest push \
            --format oci \
            --all \
            multiarch-rock oci-archive:bonsai_${{ inputs.version }}.rock

      - name: Upload multiarch rock
        uses: actions/upload-artifact@v6
        with:
          name: bonsai_${{ inputs.version }}
          path: bonsai_${{ inputs.version }}.rock
