name: CI
run-name: CI for ${{ github.ref }}

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        version: ['1.7B', '2-2B']
    uses: ./.github/workflows/build.yaml
    with:
      version: ${{ matrix.version }}

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        version: ['1.7B', '2-2B']
    uses: ./.github/workflows/test.yaml
    with:
      version: ${{ matrix.version }}
