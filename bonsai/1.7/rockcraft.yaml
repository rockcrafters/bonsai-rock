name: bonsai
title: bonsai-1.7B-rock
summary: bonsai-1.7B cpu inference with a tiny htmx chat frontend
description: |
  a bare-base canonical rock running two pebble services:
    - llm:      llama-server on the bonsai-1.7B gguf, exposing an
                OpenAI-compatible api (/v1/models, /v1/chat/completions)
    - frontend: a minimal htmx chat client that talks to it

  bind a host port to the frontend (default 8080) to get a chat ui, and/or to
  the llm service (default 8082) to use it as a local OpenAI-compatible model.

  the model itself is NOT built into this rock by rockcraft. it is injected
  afterwards as 4 separate oci layers under /usr/share/bonsai/*.part[0-3]
  (see scripts/inject-layers.sh) so the 237M weights download in parallel and
  stay cached across app rebuilds. the evaluator reassembles them on startup.
license: Apache-2.0
version: "1.7"

# bare = no os layer. we hand-stage the exact runtime libs the cgo binaries need.
base: bare
build-base: ubuntu@22.04

platforms:
  amd64:
  arm64:     # each CI runner is native for its arch, so no cross-build/qemu.
  #          # llama.cpp is built per-arch (roughly doubles total build time).

parts:
  # ---- llama.cpp as shared libs (dynamic link, per the design) --------------
  llama:
    plugin: cmake
    # mainline llama.cpp loads bonsai's Q1_0 gguf directly -- verified via
    # bonsai.py, which runs the same quant through stock llama-cpp-python (a
    # plain mainline build). no fork needed. pinned to a recent mainline release.
    source: https://github.com/ggml-org/llama.cpp.git
    source-tag: b10092
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      # keep libs in /usr/lib, not the multiarch triplet dir (usr/lib/<triplet>/)
      # that GNUInstallDirs picks on ubuntu -- so the prime globs + a single
      # LD_LIBRARY_PATH work for both arches.
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=ON
      - -DLLAMA_CURL=OFF
      # llama-server gives us the OpenAI-compatible API (/v1/chat/completions)
      # for the `llm` service, so TOOLS+SERVER+COMMON must be ON (COMMON is the
      # helper lib the tools link; TOOLS on with SERVER off fails to link).
      # this costs build time -- TOOLS builds every tool, though we only prime
      # llama-server. everything else stays off.
      - -DLLAMA_BUILD_COMMON=ON
      - -DLLAMA_BUILD_TOOLS=ON
      - -DLLAMA_BUILD_SERVER=ON
      - -DLLAMA_BUILD_TESTS=OFF
      - -DLLAMA_BUILD_EXAMPLES=OFF
      - -DLLAMA_BUILD_APP=OFF
      - -DLLAMA_BUILD_UI=OFF
      - -DGGML_NATIVE=OFF       # portable cpu build, no -march=native
      #
    build-packages:
      - build-essential
      - libgomp1
      #
    prime:
      # no headers: nothing links against llama.cpp any more (the cgo evaluator
      # is gone). just the server binary and the libs it loads at runtime.
      - usr/lib/libllama.so*
      - usr/lib/libggml*.so*
      - usr/bin/llama-server
      #

  # ---- the two go services --------------------------------------------------
  services:
    after:
      - llama
    plugin: go
    # go module (`bonsai-rock`) lives alongside this rockcraft.yaml in the
    # version dir; rockcraft only mounts the project subtree, so the source
    # must be local (a repo-root `go/` would be unreachable -- rockcraft#189).
    source: .
    build-snaps:
      # go.mod requires go 1.26; latest/stable is 1.26.x. a too-old snap makes
      # the plugin's `go version` probe trip go's toolchain auto-download and
      # fail validation ("invalid go compiler version 'go: downloading ...'").
      - go/latest/stable
      #
    build-environment:
      # pure go -- inference is llama-server's job now, so no cgo, no c/c++
      # toolchain, no linking against the staged llama libs. static binaries.
      - CGO_ENABLED: "0"
      - GOTOOLCHAIN: local      # never fetch a toolchain over the network
      #
    organize:
      bin/frontend: usr/bin/frontend
    stage:
      - usr/bin/frontend
      #

  # ---- runtime libs the bare base lacks (bundled, as agreed) ----------------
  runtime-libs:
    plugin: nil
    stage-packages:
      - libc6                   # glibc + dynamic loader (bare has none)
      - libstdc++6              # llama.cpp is c++
      - libgomp1                # openmp runtime used by ggml
      #

# pebble services. llm does the inference (llama-server, OpenAI-compatible api);
# frontend is a thin htmx client in front of it.
services:
  frontend:
    override: replace
    command: /usr/bin/frontend
    startup: enabled
    after:
      - llm
    environment:
      BONSAI_FRONTEND_ADDR: ":8080"
      BONSAI_LLM_URL: http://127.0.0.1:8082
      BONSAI_LLM_MODEL: bonsai-1.7b
      BONSAI_MAX_TOKENS: "256"
      # static go binary -- no LD_LIBRARY_PATH needed.

  # OpenAI-compatible endpoint -- point opencode et al at http://<host>:8082/v1
  # with model id bonsai-1.7b.
  #
  # the model ships as gguf-split shards, one per oci layer; llama.cpp loads the
  # whole set from shard 1, so there is nothing to reassemble at startup and no
  # wrapper process. the shard count is baked into this path, and
  # hack/split-model.sh fails the build if the split ever yields a different one.
  llm:
    override: replace
    command: /usr/bin/llama-server --model /usr/share/bonsai/model-00001-of-00004.gguf --host 0.0.0.0 --port 8082 --ctx-size 8192 --alias bonsai-1.7b
    startup: enabled
    environment:
      LD_LIBRARY_PATH: /usr/lib:/usr/lib/x86_64-linux-gnu:/usr/lib/aarch64-linux-gnu
