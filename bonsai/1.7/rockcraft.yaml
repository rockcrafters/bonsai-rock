name: bonsai
title: bonsai-1.7B-rock
summary: bonsai-1.7B cpu inference with a tiny htmx chat frontend
description: |
  a bare-base canonical rock running two pebble services:
    - evaluator: loads the bonsai-1.7B gguf and serves single-turn completions
    - frontend:  a minimal htmx chat client that proxies to the evaluator

  bind a host port to the frontend (default 8080) to get a chat ui.

  the model itself is NOT built into this rock by rockcraft. it is injected
  afterwards as 4 separate oci layers under /usr/share/bonsai/*.part[0-3]
  (see scripts/inject-layers.sh) so the 237M weights download in parallel and
  stay cached across app rebuilds. the evaluator reassembles them on startup.
license: Apache-2.0
version: "1.7"

# bare = no os layer. we hand-stage the exact runtime libs the cgo binaries need.
base: bare
build-base: ubuntu@22.04

platforms:
  amd64:
  arm64:     # each CI runner is native for its arch, so no cross-build/qemu.
  #          # llama.cpp is built per-arch (roughly doubles total build time).

parts:
  # ---- llama.cpp as shared libs (dynamic link, per the design) --------------
  llama:
    plugin: cmake
    # mainline llama.cpp loads bonsai's Q1_0 gguf directly -- verified via
    # bonsai.py, which runs the same quant through stock llama-cpp-python (a
    # plain mainline build). no fork needed. pinned to a recent mainline release.
    source: https://github.com/ggml-org/llama.cpp.git
    source-tag: b10092
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      # keep libs in /usr/lib, not the multiarch triplet dir (usr/lib/<triplet>/)
      # that GNUInstallDirs picks on ubuntu -- so the prime globs + a single
      # LD_LIBRARY_PATH work for both arches.
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=ON
      - -DLLAMA_CURL=OFF
      # we only need libllama.so + libggml*.so -- turn off every optional build.
      # TOOLS gates the server/cli (their impl libs fail to link otherwise); UI
      # defaults ON and would pull a web frontend build. COMMON is the CLI
      # helper lib (arg-parsing/chat/sampling) -- ~1.4min to build and we never
      # link it (the cgo wrapper uses llama.h only), so skip it.
      - -DLLAMA_BUILD_COMMON=OFF
      - -DLLAMA_BUILD_TESTS=OFF
      - -DLLAMA_BUILD_EXAMPLES=OFF
      - -DLLAMA_BUILD_TOOLS=OFF
      - -DLLAMA_BUILD_SERVER=OFF
      - -DLLAMA_BUILD_APP=OFF
      - -DLLAMA_BUILD_UI=OFF
      - -DGGML_NATIVE=OFF       # portable cpu build, no -march=native
      #
    build-packages:
      - build-essential
      - libgomp1
      #
    prime:
      - usr/include/**          # headers consumed at build by the evaluator part
      - usr/lib/libllama.so*
      - usr/lib/libggml*.so*
      #

  # ---- the two go services --------------------------------------------------
  services:
    after:
      - llama
    plugin: go
    # go module (`bonsai-rock`) lives alongside this rockcraft.yaml in the
    # version dir; rockcraft only mounts the project subtree, so the source
    # must be local (a repo-root `go/` would be unreachable -- rockcraft#189).
    source: .
    build-snaps:
      # go.mod requires go 1.26; latest/stable is 1.26.x. a too-old snap makes
      # the plugin's `go version` probe trip go's toolchain auto-download and
      # fail validation ("invalid go compiler version 'go: downloading ...'").
      - go/latest/stable
      #
    build-packages:
      - build-essential         # cgo needs a c/c++ toolchain
      #
    build-environment:
      - CGO_ENABLED: "1"
      - GOTOOLCHAIN: local      # never fetch a toolchain over the network
      - CGO_CFLAGS: "-I${CRAFT_STAGE}/usr/include"
      - CGO_LDFLAGS: "-L${CRAFT_STAGE}/usr/lib -L${CRAFT_STAGE}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}"
      #
    organize:
      bin/evaluator: usr/bin/evaluator
      bin/frontend: usr/bin/frontend
    stage:
      - usr/bin/evaluator
      - usr/bin/frontend
      #

  # ---- runtime libs the bare base lacks (bundled, as agreed) ----------------
  runtime-libs:
    plugin: nil
    stage-packages:
      - libc6                   # glibc + dynamic loader (bare has none)
      - libstdc++6              # llama.cpp is c++
      - libgomp1                # openmp runtime used by ggml
      #

# pebble services. evaluator loads the model, frontend serves the ui.
services:
  evaluator:
    override: replace
    command: /usr/bin/evaluator
    startup: enabled
    environment:
      BONSAI_EVAL_ADDR: ":8081"
      BONSAI_MODEL_DIR: /usr/share/bonsai
      BONSAI_MODEL: /var/lib/bonsai/model.gguf
      BONSAI_CTX: "1024"
      BONSAI_MAX_TOKENS: "256"
      LD_LIBRARY_PATH: /usr/lib:/usr/lib/x86_64-linux-gnu:/usr/lib/aarch64-linux-gnu

  frontend:
    override: replace
    command: /usr/bin/frontend
    startup: enabled
    after:
      - evaluator
    environment:
      BONSAI_FRONTEND_ADDR: ":8080"
      BONSAI_EVAL_URL: http://127.0.0.1:8081
      LD_LIBRARY_PATH: /usr/lib:/usr/lib/x86_64-linux-gnu:/usr/lib/aarch64-linux-gnu
